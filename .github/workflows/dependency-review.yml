#
# Stops a PR from adding a dependency with a known high-severity vulnerability,
# or under a license that Apache-2.0 distribution cannot accept. The scans in
# security.yml find problems already in the tree; this keeps new ones out.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Permissive licenses only. LicenseRef-scancode-google-patent-license-golang
          # is how the scanner reports the Go project's PATENTS file, which every
          # golang.org/x package ships. It grants users more, not less.
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BlueOak-1.0.0,
            BSD-2-Clause,
            BSD-3-Clause,
            BSL-1.0,
            CC-BY-4.0,
            CC0-1.0,
            ISC,
            LicenseRef-scancode-google-patent-license-golang,
            MIT,
            MPL-2.0,
            Unicode-3.0,
            Unlicense,
            Zlib
