#
# The models live in pkg/client, so that the server and its clients share them.
package: gen
output: internal/api/gen/server.gen.go
generate:
  std-http-server: true
  strict-server: true
output-options:
  nullable-type: true
  name-normalizer: ToCamelCaseWithInitialisms
additional-imports:
  - package: github.com/gerrowadat/andante/pkg/client
    alias: .
