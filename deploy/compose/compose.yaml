#
# andante's two services and a Postgres to keep them in. See docs/running.md.
#
# Needs a .env next to this file, from env.example. The repository root's
# compose.yaml is different: that one is only a database for development.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: andante
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: andante
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-catalogue.sh:/docker-entrypoint-initdb.d/catalogue.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U andante -d catalogue]
      interval: 5s
      timeout: 5s
      retries: 10

  catalogue:
    image: ${ANDANTE_IMAGE:-ghcr.io/gerrowadat/andante:0.0.1}
    entrypoint: [/usr/local/bin/andante-catalogue]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANDANTE_CATALOGUE_DATABASE_URL: postgres://catalogue:${CATALOGUE_DB_PASSWORD}@postgres:5432/catalogue?sslmode=disable
      ANDANTE_CATALOGUE_LISTEN: :8082
      ANDANTE_CATALOGUE_TOKEN: ${ANDANTE_CATALOGUE_TOKEN:?set it in .env}
      ANDANTE_BASE_URL: ${ANDANTE_BASE_URL:?set it in .env}
    ports:
      # Loopback only, for /metrics. Nothing else outside this stack needs it.
      - 127.0.0.1:${ANDANTE_CATALOGUE_PORT:-8082}:8082

  andante:
    image: ${ANDANTE_IMAGE:-ghcr.io/gerrowadat/andante:0.0.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANDANTE_DATABASE_URL: postgres://andante:${POSTGRES_PASSWORD}@postgres:5432/andante?sslmode=disable
      ANDANTE_BASE_URL: ${ANDANTE_BASE_URL:?set it in .env}
      ANDANTE_OPS_LISTEN: :8081
      ANDANTE_SECRET: ${ANDANTE_SECRET:?set it in .env}
      ANDANTE_CATALOGUE_URL: http://catalogue:8082/v1
      ANDANTE_CATALOGUE_TOKEN: ${ANDANTE_CATALOGUE_TOKEN:?set it in .env}
    # Anything else the server takes, such as an OpenID provider or the proxy in front of
    # it. See andante.env.example.
    env_file:
      - path: andante.env
        required: false
    ports:
      - ${ANDANTE_PUBLIC_PORT:-8080}:8080
      # Loopback only. /metrics and the health checks have no auth.
      - 127.0.0.1:${ANDANTE_OPS_PORT:-8081}:8081

volumes:
  postgres-data:
