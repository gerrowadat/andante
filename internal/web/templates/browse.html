{{define "content"}}<h1>Browse</h1>
<form method="get" action="{{root}}/sources">
  <fieldset role="group">
    <input type="search" name="q" value="{{.Data.Query}}" placeholder="Search" aria-label="Search">
    <select name="kind" aria-label="Kind">
      <option value="">Any kind</option>
      {{range .Data.Kinds}}<option value="{{.}}"{{if eq . $.Data.Kind}} selected{{end}}>{{.}}</option>{{end}}
    </select>
    <button>Find</button>
  </fieldset>
</form>
{{with .Data.Sources}}
<div class="overflow-auto"><table>
<thead><tr><th>Source</th><th>Kind</th><th>State</th><th>Last checked</th></tr></thead>
<tbody>{{range .}}<tr>
  <td><a href="{{root}}/sources/{{.ID}}">{{.Title}}</a></td><td>{{.Kind}}</td><td>{{.State}}</td>
  <td>{{with .Checked}}{{.}}{{else}}<span class="muted">never</span>{{end}}</td>
</tr>{{end}}</tbody>
</table></div>
{{with $.Data.Next}}<p><a href="{{root}}{{.}}">Next page</a></p>{{end}}
{{else}}
<p>Nothing matches. You can <a href="{{root}}/add">add a site</a> by its address.</p>
{{end}}{{end}}
