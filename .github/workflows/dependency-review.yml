#
# Stops a PR from adding a dependency with a known high-severity vulnerability,
# or under a license that Apache-2.0 distribution cannot accept. The scans in
# security.yml find problems already in the tree; this keeps new ones out.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MPL-2.0,
            Unlicense,
            Zlib
          # Detected as BSD-3-Clause plus a Google patent license. That is the Go
          # project's PATENTS file, which grants users more, not less. Exempted
          # by package, so that the term stays a failure anywhere else.
          allow-dependencies-licenses: pkg:golang/golang.org/x/sys
