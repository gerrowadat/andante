{{define "pace"}}
<fieldset>
  <legend>Pace</legend>
  <label><input type="radio" name="preset" value="daily"{{if eq .Preset "daily"}} checked{{end}}> One a day</label>
  <label><input type="radio" name="preset" value="weekdays"{{if eq .Preset "weekdays"}} checked{{end}}> Weekdays</label>
  <label><input type="radio" name="preset" value="days"{{if eq .Preset "days"}} checked{{end}}> On these days</label>
  <label><input type="radio" name="preset" value="replay"{{if eq .Preset "replay"}} checked{{end}}> The original timing</label>
  <label><input type="radio" name="preset" value="rrule"{{if eq .Preset "rrule"}} checked{{end}}> An RRULE</label>
</fieldset>
<div class="grid">
  <label>At <input type="text" name="at" value="{{.At}}" placeholder="07:00"> <small>For one a day, weekdays and chosen days</small></label>
  <label>Days <input type="text" name="days" value="{{.Days}}" placeholder="MO,WE,FR"> <small>For chosen days</small></label>
</div>
<div class="grid">
  <label>How many at a time <input type="number" name="count" value="{{.Count}}" min="1" max="100"></label>
  <label>Time zone <input type="text" name="tz" value="{{.TZ}}"></label>
</div>
<div class="grid">
  <label>Speed <input type="number" name="speed" value="{{.Speed}}" min="0.1" step="any"> <small>For the original timing: 7 makes a weekly serial daily</small></label>
  <label>At most this many days between entries <input type="number" name="max_gap" value="{{.MaxGap}}" min="0"> <small>For the original timing, so that a long break doesn't stall it</small></label>
</div>
<label>RRULE <input type="text" name="rrule" value="{{.RRule}}" placeholder="FREQ=WEEKLY;BYDAY=SA;BYHOUR=9"></label>
{{end}}
