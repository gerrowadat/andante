#
# Fast CI: does this compile, pass its tests, meet the lint bar, and carry its
# headers? Every action is pinned by commit SHA because zizmor reports tag pins
# as high-severity findings, which would fail the workflows job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# cancel-in-progress is for pull requests only: on main, two merges landing
# close together would otherwise leave the first commit with no answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: andante
          POSTGRES_PASSWORD: andante
          POSTGRES_DB: andante
        ports:
          - 55432:5432 # Not 5432, which a developer running act may have in use.
        options: >-
          --health-cmd "pg_isready -U andante -d andante"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        env:
          ANDANTE_TEST_DATABASE_URL: postgres://andante:andante@localhost:55432/andante?sslmode=disable
          ANDANTE_REQUIRE_DB: "1"
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: .golangci.yml is a v2-schema config, which a v1 binary
          # rejects. Keep in step with GOLANGCI_VERSION in the Makefile.
          version: v2.15.0

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # spec-diff reads the base branch's spec.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generated code is current
        run: |
          make generate
          git add -N .
          git diff --exit-code

      - name: Lint the API description
        run: make spec-lint

      # A breaking change within /api/v1 needs /api/v2, not a waiver.
      - name: The API description keeps its promises
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make spec-diff

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every source file carries its header
        run: ./scripts/license-check.sh

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.32.0 --offline .github/workflows/
