# The models live in internal/catalogue/client, so that the two can't disagree.
package: gen
output: internal/catalogue/api/gen/server.gen.go
generate:
  std-http-server: true
  strict-server: true
output-options:
  nullable-type: true
  name-normalizer: ToCamelCaseWithInitialisms
additional-imports:
  - package: github.com/gerrowadat/andante/internal/catalogue/client
    alias: .
